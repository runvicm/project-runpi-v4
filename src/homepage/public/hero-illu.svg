<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <!-- soft backdrop blob -->
  <circle cx="400" cy="290" r="255" fill="#F3F5FB"/>

  <!-- connecting pipeline line: laptop -> cloud -->
  <path d="M 300 235 C 420 150, 520 150, 560 190" stroke="#C7D2E8" stroke-width="3" stroke-dasharray="6 8" fill="none"/>
  <!-- connecting pipeline line: laptop -> stack -->
  <path d="M 235 330 C 235 370, 235 380, 235 380" stroke="#C7D2E8" stroke-width="3" stroke-dasharray="6 8" fill="none"/>

  <!-- ===== Laptop / code screen ===== -->
  <g>
    <rect x="140" y="140" width="220" height="150" rx="14" fill="#2B2F77"/>
    <rect x="158" y="158" width="184" height="114" rx="6" fill="#FFFFFF"/>
    <!-- code lines -->
    <rect x="176" y="178" width="60" height="10" rx="5" fill="#FF7A59"/>
    <rect x="176" y="198" width="100" height="10" rx="5" fill="#C7D2E8"/>
    <rect x="176" y="218" width="80" height="10" rx="5" fill="#37B6A7"/>
    <rect x="176" y="238" width="120" height="10" rx="5" fill="#C7D2E8"/>
    <!-- laptop base -->
    <path d="M 120 290 L 380 290 L 360 316 L 140 316 Z" fill="#3A3F94"/>
  </g>

  <!-- ===== Tech stack layers ===== -->
  <g>
    <rect x="140" y="380" width="190" height="46" rx="10" fill="#5B6BF0"/>
    <circle cx="164" cy="403" r="7" fill="#FFFFFF"/>
    <text x="182" y="408" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">Frontend</text>

    <rect x="140" y="434" width="190" height="46" rx="10" fill="#37B6A7"/>
    <circle cx="164" cy="457" r="7" fill="#FFFFFF"/>
    <text x="182" y="462" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">Backend / API</text>

    <rect x="140" y="488" width="190" height="46" rx="10" fill="#2B2F77"/>
    <circle cx="164" cy="511" r="7" fill="#FFFFFF"/>
    <text x="182" y="516" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">Database</text>
  </g>

  <!-- ===== Cloud / deploy ===== -->
  <g>
    <path d="M 540 240
             a 34 34 0 0 1 66 -12
             a 26 26 0 0 1 8 51
             h -96
             a 24 24 0 0 1 -6 -47
             a 30 30 0 0 1 28 8 z"
          fill="#FF7A59"/>
    <!-- upward deploy arrow -->
    <path d="M 592 226 L 592 200 M 592 200 L 580 212 M 592 200 L 604 212"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ===== CI/CD infinity loop (devops) ===== -->
  <g transform="translate(560,340)">
    <path d="M -40 0
             c 0 -22 18 -22 30 -10
             c 12 12 12 12 24 0
             c 12 -12 30 -12 30 10
             c 0 22 -18 22 -30 10
             c -12 -12 -12 -12 -24 0
             c -12 12 -30 12 -30 -10 z"
          fill="none" stroke="#5B6BF0" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ===== gear accent ===== -->
  <g transform="translate(455,420)">
    <circle r="26" fill="#FFFFFF" stroke="#2B2F77" stroke-width="6"/>
    <circle r="9" fill="#2B2F77"/>
    <g stroke="#2B2F77" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-24"/>
      <line x1="0" y1="34" x2="0" y2="24"/>
      <line x1="-34" y1="0" x2="-24" y2="0"/>
      <line x1="34" y1="0" x2="24" y2="0"/>
      <line x1="-24" y1="-24" x2="-17" y2="-17"/>
      <line x1="24" y1="24" x2="17" y2="17"/>
      <line x1="-24" y1="24" x2="-17" y2="17"/>
      <line x1="24" y1="-24" x2="17" y2="-17"/>
    </g>
  </g>

  <!-- floating dots -->
  <circle cx="120" cy="120" r="6" fill="#5B6BF0"/>
  <circle cx="640" cy="440" r="7" fill="#37B6A7"/>
  <circle cx="100" cy="450" r="5" fill="#FF7A59"/>
</svg>