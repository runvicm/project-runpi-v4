name: project-runpi
services:
  web:
    build: .
    container_name: project-runpi
    volumes: 
      - ../src:/var/www/projectrunpi:z

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8000:80"
      # - "443:443"
    volumes:
      - ../src:/var/www/projectrunpi:z
      - ../nginx/conf.d/projectrunpi.conf:/etc/nginx/conf.d/default.conf:z
